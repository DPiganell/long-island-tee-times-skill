name: Deploy Golf Practice PWA to GitHub Pages

# Publishes golf-practice/ to the gh-pages branch, which GitHub Pages serves at
# https://dpiganell.github.io/long-island-tee-times-skill/
# (The actions/deploy-pages route needs Pages pre-enabled by a repo admin;
# the gh-pages publishing branch works without touching repo settings.)

on:
  push:
    branches:
      - claude/golf-practice-pwa-nbub9r
      - main
    paths:
      - 'golf-practice/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish golf-practice/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./golf-practice
